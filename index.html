<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我们的小宇宙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#FFF7EA; --card:#FFFBF2; --ink:#5B4636; --ink-soft:#8A6F57;
  --line:#6B4A2F; --honey:#EE8F3A; --honey-deep:#D96F1E; --pink:#F6A8B8;
  --pink-soft:#FDECEF; --cream:#FBEED3; --green:#7FB069;
  --shadow:0 3px 0 rgba(107,74,47,.9);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:radial-gradient(rgba(238,143,58,.10) 1.5px, transparent 1.6px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh;
}
.hand{font-family:"Ma Shan Zheng","ZCOOL KuaiLe","PingFang SC",cursive}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
.hidden{display:none !important}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(255,247,234,.92);backdrop-filter:blur(6px);
  border-bottom:2px solid var(--line);
}
.topbar-in{max-width:880px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:7px;font-size:20px;letter-spacing:1px}
.logo .heart{color:#E4572E;font-size:19px}
nav.pills{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
nav.pills button{
  border:2px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:6px 15px;font-size:14.5px;font-weight:600;
  box-shadow:0 2px 0 rgba(107,74,47,.85);transition:all .15s;
}
nav.pills button.active{background:var(--honey);color:#fff;border-color:var(--line)}
nav.pills button:active{transform:translateY(2px);box-shadow:none}
.icon-btn{
  border:2px solid var(--line);background:var(--card);border-radius:999px;
  width:37px;height:37px;font-size:16px;line-height:1;box-shadow:0 2px 0 rgba(107,74,47,.85);
  display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.icon-btn:active{transform:translateY(2px);box-shadow:none}

main{max-width:880px;margin:0 auto;padding:18px 14px 70px}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:2px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow);padding:20px;margin-bottom:18px;
}
.btn{
  border:2px solid var(--line);background:var(--honey);color:#fff;font-weight:700;
  border-radius:999px;padding:9px 22px;font-size:15px;box-shadow:0 3px 0 rgba(107,74,47,.9);
}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.pink{background:var(--pink);color:#7A2E3F}
.btn.small{padding:6px 15px;font-size:13.5px}
.btn.danger{background:#fff;color:#C0392B;border-color:#C0392B;box-shadow:0 3px 0 rgba(192,57,43,.5)}

/* ---------- home ---------- */
.hero-names{display:flex;align-items:flex-start;justify-content:center;gap:6px;margin-top:4px}
.pup{text-align:center;width:118px}
.pup .who{margin-top:2px;font-size:17px}
.pup .who small{display:block;font-family:inherit;font-size:11.5px;color:var(--ink-soft)}
.ecg{flex:1;max-width:300px;margin-top:26px;min-width:90px}
.big-days{text-align:center;margin:8px 0 2px}
.big-days .label{font-size:19px;letter-spacing:2px}
.big-days .num{
  font-family:"Ma Shan Zheng",cursive;font-size:96px;line-height:1.05;color:var(--honey-deep);
  text-shadow:3px 3px 0 rgba(238,143,58,.25);
}
.big-days .from{color:var(--ink-soft);font-size:14px;margin-top:2px}
.count-card{display:flex;align-items:center;gap:14px}
.count-card .ring{font-size:34px}
.count-card .t1{font-size:17px;font-weight:700}
.count-card .t2{color:var(--ink-soft);font-size:13.5px;margin-top:2px}
.progress{height:12px;border:2px solid var(--line);border-radius:999px;background:#fff;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--honey) 0 10px,#F6B26B 10px 20px);border-radius:999px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
.quick button{
  border:2px solid var(--line);background:var(--card);border-radius:19px;padding:14px 4px 11px;
  box-shadow:0 3px 0 rgba(107,74,47,.9);font-size:14.5px;font-weight:700;color:var(--ink);
}
.quick button .qi{font-size:27px;display:block;margin-bottom:5px}
.quick button:active{transform:translateY(3px);box-shadow:none}
.banner{
  border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  padding:20px;margin-bottom:18px;color:#fff;position:relative;overflow:hidden;
}
.banner.b1{background:linear-gradient(120deg,#F2A65A,#E4572E)}
.banner.b2{background:linear-gradient(120deg,#7FB069,#4E7A51)}
.banner .bt{font-size:21px;line-height:1.5}
.banner .bs{opacity:.92;font-size:13.5px;margin-top:5px}

/* ---------- album ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.ph{
  border:2px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;
  box-shadow:0 3px 0 rgba(107,74,47,.85);cursor:pointer;
}
.ph img{width:100%;height:118px;object-fit:cover;display:block}
.ph .cap{padding:7px 9px;font-size:12.5px;line-height:1.45}
.ph .cap .d{color:var(--ink-soft);font-size:11.5px}
@media(max-width:560px){.ph img{height:104px}.quick{grid-template-columns:repeat(4,1fr)}}

/* ---------- timeline ---------- */
.tl{position:relative;margin:6px 0 0 12px;padding-left:26px;border-left:3px dashed rgba(107,74,47,.45)}
.node{position:relative;margin-bottom:20px}
.node::before{
  content:"";position:absolute;left:-37px;top:5px;width:15px;height:15px;border-radius:50%;
  background:var(--pink);border:2.5px solid var(--line);
}
.node .nd{color:var(--honey-deep);font-weight:700;font-size:13.5px}
.node .nt{font-size:18.5px;margin:2px 0}
.node .nn{color:var(--ink-soft);font-size:14px;line-height:1.65}
.node .ops{margin-top:6px;display:flex;gap:7px}
.mini-btn{border:1.8px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:600}
.mini-btn.red{color:#C0392B;border-color:#C0392B}

/* ---------- letters ---------- */
.letter{
  display:flex;gap:13px;align-items:center;
}
.letter .env{font-size:36px;flex:none}
.letter .lt{font-size:17.5px}
.letter .lm{color:var(--ink-soft);font-size:13px;margin-top:2px}
.seal{margin-left:auto;flex:none;font-size:12.5px;border:2px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--cream);font-weight:700}
.seal.open{background:var(--pink-soft)}

/* ---------- forms / modal ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(91,70,54,.45);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{
  background:var(--paper);border:2.5px solid var(--line);border-radius:24px 24px 0 0;
  width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:22px 20px 26px;
}
@media(min-width:640px){.modal{border-radius:24px}}
.modal h3{margin:0 0 14px;font-size:21px}
.f-row{margin-bottom:13px}
.f-row label{display:block;font-size:13.5px;font-weight:700;margin-bottom:5px}
.f-row input,.f-row textarea,.f-row select{
  width:100%;border:2px solid var(--line);border-radius:13px;padding:9px 12px;background:#fff;outline:none;
}
.f-row textarea{min-height:110px;resize:vertical;line-height:1.6}
.f-ops{display:flex;gap:9px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.view-img{width:100%;border-radius:15px;border:2px solid var(--line);display:block}
.letter-body{white-space:pre-wrap;line-height:1.9;font-size:16px;background:#fff;border:2px solid var(--line);border-radius:15px;padding:16px}
.empty{text-align:center;color:var(--ink-soft);padding:26px 10px;font-size:14.5px;line-height:1.8}
.sec-head{display:flex;align-items:center;margin:4px 0 14px}
.sec-head h2{margin:0;font-size:23px}
.sec-head .btn{margin-left:auto}

/* ---------- auth ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 14px}
.auth-card{width:100%;max-width:400px;text-align:center}
.auth-card h1{font-size:30px;margin:6px 0 2px}
.auth-card .sub{color:var(--ink-soft);font-size:14px;margin-bottom:16px}
.auth-card .f-row{text-align:left}
.auth-msg{font-size:13.5px;min-height:20px;margin-top:10px;color:#C0392B;line-height:1.6}
.auth-msg.ok{color:var(--green)}
.linkish{background:none;border:none;color:var(--honey-deep);font-weight:700;font-size:14px;text-decoration:underline}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;
  background:var(--ink);color:#FFF7EA;border-radius:999px;padding:9px 20px;font-size:14px;
  box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;
}
.toast.show{opacity:1}
footer{text-align:center;color:var(--ink-soft);font-size:12.5px;padding:0 14px 30px}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="authView" class="auth-wrap hidden">
  <div class="card auth-card">
    <div style="font-size:40px">💌</div>
    <h1 class="hand">我们的小宇宙</h1>
    <div class="sub">这里只住着两个人 · 请先登录</div>
    <div class="f-row"><label>邮箱</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div>
    <div class="f-row"><label>密码</label><input id="authPass" type="password" autocomplete="current-password" placeholder="至少 6 位"></div>
    <button class="btn" id="btnLogin" style="width:100%">登 录</button>
    <div style="margin-top:12px;font-size:13.5px;color:var(--ink-soft)">第一次来？<button class="linkish" id="btnGoRegister">用邮箱注册</button></div>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView" class="hidden">
  <div class="topbar"><div class="topbar-in">
    <div class="logo hand"><span class="heart">❤</span><span id="siteTitle">我们的小宇宙</span></div>
    <nav class="pills">
      <button data-tab="home" class="active">首页</button>
      <button data-tab="album">相册</button>
      <button data-tab="timeline">回忆</button>
      <button data-tab="letters">时光信</button>
    </nav>
    <button class="icon-btn" id="btnSettings" title="设置">⚙️</button>
    <button class="icon-btn" id="btnLogout" title="退出登录">🚪</button>
  </div></div>

  <main>
    <!-- HOME -->
    <section id="tab-home">
      <div class="card">
        <div class="hero-names">
          <div class="pup">
            <svg width="96" height="86" viewBox="0 0 96 86"><ellipse cx="22" cy="26" rx="11" ry="17" fill="#B97F45" stroke="#6B4A2F" stroke-width="2.5" transform="rotate(-18 22 26)"/><ellipse cx="74" cy="26" rx="11" ry="17" fill="#B97F45" stroke="#6B4A2F" stroke-width="2.5" transform="rotate(18 74 26)"/><circle cx="48" cy="46" r="31" fill="#D9A066" stroke="#6B4A2F" stroke-width="2.5"/><rect x="24" y="34" width="20" height="12" rx="6" fill="#333"/><rect x="52" y="34" width="20" height="12" rx="6" fill="#333"/><rect x="43" y="38" width="10" height="4" fill="#333"/><ellipse cx="48" cy="56" rx="6" ry="4.5" fill="#8A5A33"/><path d="M42 63 Q48 68 54 63" stroke="#6B4A2F" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="29" cy="55" r="5" fill="#F6A8B8" opacity=".65"/><circle cx="67" cy="55" r="5" fill="#F6A8B8" opacity=".65"/></svg>
            <div class="who hand"><span id="nameA1">他</span><small>戴墨镜的小棕</small></div>
          </div>
          <svg class="ecg" height="34" viewBox="0 0 300 34" preserveAspectRatio="none"><polyline points="0,17 70,17 88,17 96,6 106,28 114,17 140,17" fill="none" stroke="#E4572E" stroke-width="2.5" stroke-linecap="round"/><text x="152" y="24" font-size="17" fill="#E4572E">❤</text><polyline points="172,17 205,17 213,6 223,28 231,17 300,17" fill="none" stroke="#E4572E" stroke-width="2.5" stroke-linecap="round"/></svg>
          <div class="pup">
            <svg width="96" height="86" viewBox="0 0 96 86"><ellipse cx="22" cy="26" rx="11" ry="17" fill="#EDE4D3" stroke="#6B4A2F" stroke-width="2.5" transform="rotate(-18 22 26)"/><ellipse cx="74" cy="26" rx="11" ry="17" fill="#EDE4D3" stroke="#6B4A2F" stroke-width="2.5" transform="rotate(18 74 26)"/><circle cx="48" cy="44" r="31" fill="#FFFDF6" stroke="#6B4A2F" stroke-width="2.5"/><circle cx="38" cy="42" r="3.2" fill="#5B4636"/><circle cx="58" cy="42" r="3.2" fill="#5B4636"/><ellipse cx="48" cy="52" rx="5" ry="4" fill="#C98A5A"/><path d="M43 59 Q48 63 53 59" stroke="#6B4A2F" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="29" cy="52" r="5" fill="#F6A8B8" opacity=".8"/><circle cx="67" cy="52" r="5" fill="#F6A8B8" opacity=".8"/><g><rect x="60" y="58" width="17" height="21" rx="3" fill="#F6C177" stroke="#6B4A2F" stroke-width="2"/><rect x="60" y="64" width="17" height="15" rx="3" fill="#B08968"/><circle cx="65" cy="74" r="1.8" fill="#333"/><circle cx="71" cy="71" r="1.8" fill="#333"/><circle cx="68" cy="77" r="1.8" fill="#333"/><rect x="67" y="50" width="3.5" height="10" rx="1.5" fill="#E4572E" transform="rotate(12 68 55)"/></g></svg>
            <div class="who hand"><span id="nameB1">她</span><small>抱奶茶的小白</small></div>
          </div>
        </div>
        <div class="big-days">
          <div class="label hand">我们已相爱</div>
          <div class="num" id="daysNum">–</div>
          <div class="from" id="daysFrom">从设置里填上在一起的那一天开始</div>
        </div>
      </div>

      <div class="card" id="nextCard">
        <div class="count-card">
          <div class="ring">⏳</div>
          <div style="flex:1">
            <div class="t1" id="nextTitle">即将到来的纪念日</div>
            <div class="t2" id="nextSub">填好起始日后，这里会自动倒计时</div>
            <div class="progress"><i id="nextBar" style="width:0%"></i></div>
          </div>
          <div style="text-align:center;flex:none">
            <div class="hand" id="nextDays" style="font-size:34px;color:var(--honey-deep)">–</div>
            <div style="font-size:12px;color:var(--ink-soft)">天后</div>
          </div>
        </div>
      </div>

      <div class="quick" style="margin-bottom:18px">
        <button data-go="album"><span class="qi">📷</span>时光相册</button>
        <button data-go="timeline"><span class="qi">🗓️</span>回忆线</button>
        <button data-go="letters"><span class="qi">✉️</span>时光信</button>
        <button id="quickSettings"><span class="qi">🎂</span>纪念日</button>
      </div>

      <div class="banner b1"><div class="bt hand">和你一起看过的风景，都是最美的画面</div><div class="bs">把日子过成故事，一页一页慢慢写</div></div>
      <div class="banner b2"><div class="bt hand">只要有你在身边，每一天都是好天气</div><div class="bs">继续创造 · 属于我们的故事</div></div>
    </section>

    <!-- ALBUM -->
    <section id="tab-album" class="hidden">
      <div class="sec-head"><h2 class="hand">时光相册</h2><button class="btn small" id="btnAddPhoto">＋ 添加照片</button></div>
      <input type="file" id="photoFile" accept="image/*" class="hidden">
      <div class="grid" id="photoGrid"></div>
      <div class="empty hidden" id="photoEmpty">相册还空着<br>把你们的第一张照片放进来吧 📷</div>
    </section>

    <!-- TIMELINE -->
    <section id="tab-timeline" class="hidden">
      <div class="sec-head"><h2 class="hand">回忆时间线</h2><button class="btn small" id="btnAddMoment">＋ 添加节点</button></div>
      <div class="card"><div class="tl" id="momentList"></div>
      <div class="empty hidden" id="momentEmpty">故事线还空着<br>从第一次见面开始写吧 ✍️</div></div>
    </section>

    <!-- LETTERS -->
    <section id="tab-letters" class="hidden">
      <div class="sec-head"><h2 class="hand">时光信</h2><button class="btn small" id="btnAddLetter">＋ 写一封信</button></div>
      <div id="letterList"></div>
      <div class="empty hidden" id="letterEmpty">还没有时光信<br>写一封锁起来，到日子再一起拆 💌</div>
    </section>
  </main>
  <footer><span id="footNames">我们的小宇宙</span> · 每一天都是礼物</footer>
</div>

<!-- ================= MODALS ================= -->
<div id="modalBg" class="modal-bg hidden"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://xmdemwagzfziozbpgagh.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtZGVtd2FnemZ6aW96YnBnYWdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5NTY2NDAsImV4cCI6MjExMDUzMjY0MH0.U6C1h05Tgo6nyFPrMHorSUtjv5ijj9fS0ZsquVHcwTg";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = id => document.getElementById(id);
const S = { settings:null, moments:[], anniversaries:[], letters:[], photos:[] };

/* ---------- date helpers (local timezone) ---------- */
function dstr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return dstr(new Date()); }
function parseD(s){ if(!s) return null; const p=s.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]); }
function diffDays(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); } // b - a
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return dstr(d); }
function fmtCN(s){ const d=parseD(s); return d ? d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日" : ""; }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- modal ---------- */
function openModal(html){ $("modalBox").innerHTML=html; $("modalBg").classList.remove("hidden"); }
function closeModal(){ $("modalBg").classList.add("hidden"); $("modalBox").innerHTML=""; }
$("modalBg").addEventListener("click", e=>{ if(e.target.id==="modalBg") closeModal(); });

/* ---------- auth ---------- */
function authMsg(msg, ok){ const m=$("authMsg"); m.textContent=msg||""; m.className="auth-msg"+(ok?" ok":""); }
$("btnLogin").addEventListener("click", async ()=>{
  const email=$("authEmail").value.trim(), pass=$("authPass").value;
  if(!email||!pass) return authMsg("先填邮箱和密码");
  authMsg("登录中…", true);
  const { error } = await sb.auth.signInWithPassword({ email, password:pass });
  if(error) return authMsg("登录失败："+errText(error));
  authMsg(""); enterApp();
});
$("btnGoRegister").addEventListener("click", async ()=>{
  const email=$("authEmail").value.trim(), pass=$("authPass").value;
  if(!email||!pass) return authMsg("先填邮箱和密码，再点注册");
  if(pass.length<6) return authMsg("密码至少 6 位");
  authMsg("注册中…", true);
  const { data, error } = await sb.auth.signUp({ email, password:pass });
  if(error) return authMsg("注册失败："+errText(error));
  if(data.session){ authMsg(""); enterApp(); }
  else authMsg("注册好了！去邮箱点一下确认链接，然后回来登录。", true);
});
function errText(e){ const m=e.message||""; if(m.includes("Invalid login")) return "邮箱或密码不对"; if(m.includes("already registered")) return "这个邮箱已经注册过，直接登录"; if(m.includes("Email not confirmed")) return "邮箱还没确认，先去邮箱点确认链接"; return m; }
$("btnLogout").addEventListener("click", async ()=>{ await sb.auth.signOut(); location.reload(); });

/* ---------- data ---------- */
async function loadAll(){
  const [a,b,c,d,e] = await Promise.all([
    sb.from("settings").select("*").eq("id",1).single(),
    sb.from("moments").select("*").order("date",{ascending:true}),
    sb.from("anniversaries").select("*").order("date",{ascending:true}),
    sb.from("letters").select("*").order("created_at",{ascending:false}),
    sb.from("photos").select("*").order("taken_on",{ascending:true, nullsFirst:false})
  ]);
  S.settings = a.data || { id:1 };
  S.moments = b.data||[]; S.anniversaries = c.data||[]; S.letters = d.data||[]; S.photos = e.data||[];
  for(const p of S.photos){
    const { data } = await sb.storage.from("photos").createSignedUrl(p.storage_path, 3600);
    p.url = data ? data.signedUrl : "";
  }
}
async function enterApp(){
  $("authView").classList.add("hidden"); $("appView").classList.remove("hidden");
  await loadAll(); renderAll();
}
function renderAll(){ renderHome(); renderAlbum(); renderTimeline(); renderLetters(); }

/* ---------- tabs ---------- */
function goTab(name){
  document.querySelectorAll("nav.pills button").forEach(b=>b.classList.toggle("active", b.dataset.tab===name));
  ["home","album","timeline","letters"].forEach(t=>$("tab-"+t).classList.toggle("hidden", t!==name));
  window.scrollTo({top:0});
}
document.querySelectorAll("nav.pills button").forEach(b=>b.addEventListener("click", ()=>goTab(b.dataset.tab)));
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click", ()=>goTab(b.dataset.go)));
$("quickSettings").addEventListener("click", openSettings);
$("btnSettings").addEventListener("click", openSettings);

/* ---------- home ---------- */
function nextAnniversary(){
  const t = todayStr(), start = S.settings && S.settings.start_date;
  const cands = [];
  if(start && start<=t){
    const n = diffDays(start,t)+1; // inclusive days together
    const m = Math.ceil((n+1)/100)*100;
    cands.push({ title:"在一起第 "+m+" 天", date:addDays(start,m-1), progress:(n-(m-100))/100 });
    // yearly anniversary of start
    const sd = parseD(start); let y = new Date().getFullYear();
    let cand = new Date(y, sd.getMonth(), sd.getDate());
    if(dstr(cand) < t) cand = new Date(y+1, sd.getMonth(), sd.getDate());
    const yrs = cand.getFullYear()-sd.getFullYear();
    const prev = new Date(cand.getFullYear()-1, sd.getMonth(), sd.getDate());
    cands.push({ title:"在一起 "+yrs+" 周年", date:dstr(cand), progress: 1 - diffDays(t,dstr(cand))/Math.max(1,diffDays(dstr(prev),dstr(cand))) });
  }
  for(const a of S.anniversaries){
    const d0 = parseD(a.date); if(!d0) continue;
    if(a.repeat==="yearly"){
      let cand = new Date(new Date().getFullYear(), d0.getMonth(), d0.getDate());
      if(dstr(cand) < t) cand = new Date(cand.getFullYear()+1, d0.getMonth(), d0.getDate());
      const prev = new Date(cand.getFullYear()-1, d0.getMonth(), d0.getDate());
      cands.push({ title:a.title, date:dstr(cand), progress: 1 - diffDays(t,dstr(cand))/Math.max(1,diffDays(dstr(prev),dstr(cand))) });
    } else if(a.repeat==="monthly"){
      const now = new Date(); let cand = new Date(now.getFullYear(), now.getMonth(), Math.min(d0.getDate(), 28));
      if(dstr(cand) < t) cand = new Date(now.getFullYear(), now.getMonth()+1, Math.min(d0.getDate(), 28));
      const prev = new Date(cand.getFullYear(), cand.getMonth()-1, Math.min(d0.getDate(), 28));
      cands.push({ title:a.title, date:dstr(cand), progress: 1 - diffDays(t,dstr(cand))/Math.max(1,diffDays(dstr(prev),dstr(cand))) });
    } else if(a.date >= t){
      cands.push({ title:a.title, date:a.date, progress: Math.max(0, 1 - diffDays(t,a.date)/365) });
    }
  }
  cands.sort((x,y)=> x.date<y.date ? -1 : 1);
  return cands[0] || null;
}
function renderHome(){
  const st = S.settings||{};
  const na = st.name_a||"他", nb = st.name_b||"她";
  $("nameA1").textContent = na; $("nameB1").textContent = nb;
  $("siteTitle").textContent = "我们的小宇宙";
  $("footNames").textContent = na+" ❤ "+nb+"的小宇宙";
  if(st.start_date){
    const n = diffDays(st.start_date, todayStr())+1;
    $("daysNum").textContent = n>0 ? n : "–";
    $("daysFrom").textContent = "从 "+fmtCN(st.start_date)+" 开始 · "+na+" ❤ "+nb;
  } else { $("daysNum").textContent="–"; $("daysFrom").textContent="点右上角 ⚙️ 填上在一起的那一天"; }
  const nx = nextAnniversary();
  if(nx){
    const left = diffDays(todayStr(), nx.date);
    $("nextTitle").textContent = left===0 ? "🎉 今天就是："+nx.title : nx.title;
    $("nextSub").textContent = fmtCN(nx.date)+(left===0 ? " · 就是今天，好好庆祝！" : "");
    $("nextDays").textContent = left;
    $("nextBar").style.width = Math.round(Math.min(1,Math.max(0,nx.progress))*100)+"%";
  } else {
    $("nextTitle").textContent="即将到来的纪念日"; $("nextSub").textContent="填好起始日后，这里会自动倒计时";
    $("nextDays").textContent="–"; $("nextBar").style.width="0%";
  }
}

/* ---------- album ---------- */
function renderAlbum(){
  const g = $("photoGrid"); g.innerHTML="";
  $("photoEmpty").classList.toggle("hidden", S.photos.length>0);
  for(const p of S.photos){
    const div=document.createElement("div"); div.className="ph";
    div.innerHTML = `<img src="${esc(p.url)}" alt="" loading="lazy"><div class="cap">${esc(p.caption||"我们的照片")}<div class="d">${p.taken_on?fmtCN(p.taken_on):""}</div></div>`;
    div.addEventListener("click", ()=>viewPhoto(p));
    g.appendChild(div);
  }
}
let pendingFile=null;
$("btnAddPhoto").addEventListener("click", ()=>$("photoFile").click());
$("photoFile").addEventListener("change", e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  pendingFile=f;
  const url=URL.createObjectURL(f);
  openModal(`<h3 class="hand">添加照片</h3>
    <img class="view-img" src="${url}">
    <div class="f-row" style="margin-top:13px"><label>配文</label><input id="pfCap" placeholder="比如：第一次一起看电影"></div>
    <div class="f-row"><label>拍摄日期</label><input id="pfDate" type="date" value="${todayStr()}"></div>
    <div class="f-ops"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="pfSave">保存到相册</button></div>`);
  $("pfSave").addEventListener("click", async ()=>{
    const btn=$("pfSave"); btn.textContent="上传中…"; btn.disabled=true;
    const path = Date.now()+"_"+f.name.replace(/[^\w.\-]/g,"_");
    const up = await sb.storage.from("photos").upload(path, f);
    if(up.error){ btn.textContent="保存到相册"; btn.disabled=false; return toast("上传失败："+up.error.message); }
    const ins = await sb.from("photos").insert({ storage_path:path, caption:$("pfCap").value.trim(), taken_on:$("pfDate").value||null });
    if(ins.error){ btn.textContent="保存到相册"; btn.disabled=false; return toast("保存失败："+ins.error.message); }
    pendingFile=null; closeModal(); await loadAll(); renderAlbum(); renderHome(); toast("照片收好啦 📷");
  });
});
function viewPhoto(p){
  openModal(`<img class="view-img" src="${esc(p.url)}">
    <div style="margin-top:12px;font-size:17px" class="hand">${esc(p.caption||"我们的照片")}</div>
    <div style="color:var(--ink-soft);font-size:13px;margin-top:3px">${p.taken_on?fmtCN(p.taken_on):""}</div>
    <div class="f-ops"><button class="btn danger" id="pvDel">删除</button><button class="btn ghost" id="pvEdit">改配文</button><button class="btn" onclick="closeModal()">关闭</button></div>`);
  $("pvDel").addEventListener("click", async ()=>{
    if(!confirm("删掉这张照片？删了就找不回来啦")) return;
    await sb.storage.from("photos").remove([p.storage_path]);
    await sb.from("photos").delete().eq("id",p.id);
    closeModal(); await loadAll(); renderAlbum(); toast("已删除");
  });
  $("pvEdit").addEventListener("click", ()=>{
    openModal(`<h3 class="hand">改配文</h3>
      <div class="f-row"><label>配文</label><input id="peCap" value="${esc(p.caption||"")}"></div>
      <div class="f-row"><label>拍摄日期</label><input id="peDate" type="date" value="${p.taken_on||""}"></div>
      <div class="f-ops"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="peSave">保存</button></div>`);
    $("peSave").addEventListener("click", async ()=>{
      const { error } = await sb.from("photos").update({ caption:$("peCap").value.trim(), taken_on:$("peDate").value||null }).eq("id",p.id);
      if(error) return toast("保存失败："+error.message);
      closeModal(); await loadAll(); renderAlbum(); toast("改好啦");
    });
  });
}

/* ---------- timeline ---------- */
function renderTimeline(){
  const list=$("momentList"); list.innerHTML="";
  $("momentEmpty").classList.toggle("hidden", S.moments.length>0);
  for(const m of S.moments){
    const div=document.createElement("div"); div.className="node";
    div.innerHTML=`<div class="nd">${fmtCN(m.date)}</div><div class="nt hand">${esc(m.title)}</div>
      ${m.note?`<div class="nn">${esc(m.note)}</div>`:""}
      <div class="ops"><button class="mini-btn" data-e>编辑</button><button class="mini-btn red" data-d>删除</button></div>`;
    div.querySelector("[data-e]").addEventListener("click", ()=>momentForm(m));
    div.querySelector("[data-d]").addEventListener("click", async ()=>{
      if(!confirm("删掉这个节点？")) return;
      await sb.from("moments").delete().eq("id",m.id); await loadAll(); renderTimeline(); toast("已删除");
    });
    list.appendChild(div);
  }
}
$("btnAddMoment").addEventListener("click", ()=>momentForm(null));
function momentForm(m){
  openModal(`<h3 class="hand">${m?"编辑节点":"添加节点"}</h3>
    <div class="f-row"><label>日期</label><input id="mfDate" type="date" value="${m?m.date:todayStr()}"></div>
    <div class="f-row"><label>标题</label><input id="mfTitle" value="${m?esc(m.title):""}" placeholder="比如：第一次见面"></div>
    <div class="f-row"><label>想记下来的话</label><textarea id="mfNote" placeholder="那天发生了什么…">${m?esc(m.note||""):""}</textarea></div>
    <div class="f-ops"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="mfSave">保存</button></div>`);
  $("mfSave").addEventListener("click", async ()=>{
    const payload={ date:$("mfDate").value, title:$("mfTitle").value.trim(), note:$("mfNote").value.trim() };
    if(!payload.date||!payload.title) return toast("日期和标题都要填");
    const r = m ? await sb.from("moments").update(payload).eq("id",m.id) : await sb.from("moments").insert(payload);
    if(r.error) return toast("保存失败："+r.error.message);
    closeModal(); await loadAll(); renderTimeline(); toast("记下来啦 ✍️");
  });
}

/* ---------- letters ---------- */
function letterLocked(l){ return l.unlock_on && l.unlock_on > todayStr(); }
function renderLetters(){
  const list=$("letterList"); list.innerHTML="";
  $("letterEmpty").classList.toggle("hidden", S.letters.length>0);
  for(const l of S.letters){
    const locked=letterLocked(l);
    const div=document.createElement("div"); div.className="card letter"; div.style.cursor="pointer";
    div.innerHTML=`<div class="env">${locked?"🔒":"💌"}</div>
      <div style="flex:1;min-width:0"><div class="lt hand">${esc(l.title||"一封信")}</div>
      <div class="lm">写于 ${fmtCN((l.created_at||"").slice(0,10))} · ${l.unlock_on?("解锁日 "+fmtCN(l.unlock_on)):"随时可拆"}</div></div>
      <div class="seal ${locked?"":"open"}">${locked?"封存中":"可拆开"}</div>`;
    div.addEventListener("click", ()=>viewLetter(l));
    list.appendChild(div);
  }
}
$("btnAddLetter").addEventListener("click", ()=>{
  openModal(`<h3 class="hand">写一封时光信</h3>
    <div class="f-row"><label>标题</label><input id="lfTitle" placeholder="比如：给一周年的我们"></div>
    <div class="f-row"><label>信的内容</label><textarea id="lfBody" style="min-height:150px" placeholder="想对那天的 TA 说的话…"></textarea></div>
    <div class="f-row"><label>哪天才能拆（留空 = 随时可拆）</label><input id="lfUnlock" type="date"></div>
    <div class="f-ops"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="lfSave">封存这封信</button></div>`);
  $("lfSave").addEventListener("click", async ()=>{
    const payload={ title:$("lfTitle").value.trim(), body:$("lfBody").value, unlock_on:$("lfUnlock").value||null };
    if(!payload.title||!payload.body.trim()) return toast("标题和内容都要写哦");
    const { error } = await sb.from("letters").insert(payload);
    if(error) return toast("保存失败："+error.message);
    closeModal(); await loadAll(); renderLetters(); toast("信封好啦 🔒");
  });
});
function viewLetter(l){
  const locked=letterLocked(l);
  if(locked){
    openModal(`<div style="text-align:center;padding:8px 0">
      <div style="font-size:52px">🔒</div>
      <h3 class="hand" style="margin:8px 0">${esc(l.title||"一封信")}</h3>
      <p style="color:var(--ink-soft);line-height:1.8">这封信还在时光里封存着<br>到 <b>${fmtCN(l.unlock_on)}</b> 才能拆开<br>还有 ${diffDays(todayStr(), l.unlock_on)} 天，慢慢等 🌙</p>
      <div class="f-ops" style="justify-content:center"><button class="btn danger" id="lvDel">删除这封信</button><button class="btn" onclick="closeModal()">先放着</button></div></div>`);
  } else {
    openModal(`<h3 class="hand">${esc(l.title||"一封信")}</h3>
      <div class="letter-body">${esc(l.body)}</div>
      <div style="color:var(--ink-soft);font-size:13px;margin-top:10px">写于 ${fmtCN((l.created_at||"").slice(0,10))}</div>
      <div class="f-ops"><button class="btn danger" id="lvDel">删除</button><button class="btn" onclick="closeModal()">收好</button></div>`);
  }
  $("lvDel").addEventListener("click", async ()=>{
    if(!confirm("删掉这封信？")) return;
    await sb.from("letters").delete().eq("id",l.id); closeModal(); await loadAll(); renderLetters(); toast("已删除");
  });
}

/* ---------- settings ---------- */
function openSettings(){
  const st=S.settings||{};
  const annRows = S.anniversaries.map(a=>`<div style="display:flex;align-items:center;gap:8px;border:2px dashed rgba(107,74,47,.4);border-radius:13px;padding:8px 12px;margin-bottom:8px">
      <div style="flex:1"><b>${esc(a.title)}</b> <span style="color:var(--ink-soft);font-size:12.5px">${fmtCN(a.date)} · ${a.repeat==="yearly"?"每年":a.repeat==="monthly"?"每月":"一次"}</span></div>
      <button class="mini-btn red" data-del-ann="${a.id}">删除</button></div>`).join("");
  openModal(`<h3 class="hand">小宇宙设置</h3>
    <div class="f-row"><label>他的名字</label><input id="stA" value="${esc(st.name_a||"")}"></div>
    <div class="f-row"><label>她的名字</label><input id="stB" value="${esc(st.name_b||"")}"></div>
    <div class="f-row"><label>在一起的起始日</label><input id="stStart" type="date" value="${st.start_date||""}"></div>
    <div class="f-ops" style="justify-content:flex-start;margin:0 0 18px"><button class="btn" id="stSave">保存设置</button></div>
    <h3 class="hand" style="font-size:19px">自定义纪念日</h3>
    <div id="annList">${annRows||'<div style="color:var(--ink-soft);font-size:13.5px;margin-bottom:10px">还没有自定义纪念日（百天和周年会自动算）</div>'}</div>
    <div class="f-row"><label>名称</label><input id="anTitle" placeholder="比如：第一次牵手纪念日"></div>
    <div class="f-row"><label>日期</label><input id="anDate" type="date"></div>
    <div class="f-row"><label>重复</label><select id="anRepeat"><option value="once">只此一次</option><option value="yearly">每年</option><option value="monthly">每月</option></select></div>
    <div class="f-ops"><button class="btn ghost" onclick="closeModal()">关闭</button><button class="btn pink" id="anAdd">添加纪念日</button></div>`);
  $("stSave").addEventListener("click", async ()=>{
    const payload={ name_a:$("stA").value.trim(), name_b:$("stB").value.trim(), start_date:$("stStart").value||null };
    const { error } = await sb.from("settings").update(payload).eq("id",1);
    if(error) return toast("保存失败："+error.message);
    await loadAll(); renderAll(); toast("设置好啦 ⚙️");
  });
  $("anAdd").addEventListener("click", async ()=>{
    const payload={ title:$("anTitle").value.trim(), date:$("anDate").value, repeat:$("anRepeat").value };
    if(!payload.title||!payload.date) return toast("名称和日期都要填");
    const { error } = await sb.from("anniversaries").insert(payload);
    if(error) return toast("添加失败："+error.message);
    await loadAll(); renderHome(); openSettings(); toast("纪念日记下啦 🎂");
  });
  document.querySelectorAll("[data-del-ann]").forEach(b=>b.addEventListener("click", async ()=>{
    await sb.from("anniversaries").delete().eq("id", b.dataset.delAnn);
    await loadAll(); renderHome(); openSettings();
  }));
}

/* ---------- boot ---------- */
(async ()=>{
  const { data } = await sb.auth.getSession();
  if(data.session) enterApp(); else $("authView").classList.remove("hidden");
  sb.auth.onAuthStateChange((ev, session)=>{ if(ev==="SIGNED_IN" && session && $("appView").classList.contains("hidden")) enterApp(); });
})();
</script>
